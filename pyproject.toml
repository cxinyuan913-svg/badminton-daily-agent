[project]
name = "badminton-daily-agent"
version = "0.1.0"
description = "每日收集國際羽球賽果與新聞，記住選手生涯，產出一分鐘 IG 影片草稿"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "anthropic>=1.0",
    "pypinyin>=0.50",
    "pypdf>=5",                 # 中華羽協甲組名單 PDF（台灣歷史選手中文名比對）
]

[project.optional-dependencies]
dev = ["pytest>=8", "sqlite-vec>=0.1.6"]
# 交接單 007 新聞向量庫：torch 請先依顯示卡裝 CUDA 版（pip install torch --index-url https://download.pytorch.org/whl/cu126），沒有 GPU 會用 CPU
vectors = ["torch>=2.4", "sentence-transformers>=3", "sqlite-vec>=0.1.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["brief"]

[tool.setuptools.package-data]
brief = ["schema.sql", "player_zh.csv"]
